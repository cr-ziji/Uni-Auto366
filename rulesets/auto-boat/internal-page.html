<script>
    // ===== 百舸争流（龙舟）自动答题 + 控制台 =====
    //
    // 游戏是 Cocos Creator 3.8 场景，题目和选项都是场景节点。AnswerArea
    // 组件里已经存好了“正确答案是第几个选项”（_answerIndex），这里直接读它，
    // 不做文字比对，也不碰题库数据。
    //
    // 控制台支持鼠标拖拽和触控拖拽，可显示日志、控制正确率、控制作答/切题间隔。
    // “跳过动画”开关（默认关闭）会把答题区的动画时长压到几乎为 0，并加快轮询，
    // 关闭后恢复原有动画时长。
    (function () {
        'use strict';

        var VERSION = '2.1.0';
        var TICK_MS = 100;
        var TICK_FAST_MS = 40;
        var LOG_LIMIT = 300;
        var NEXT_RETRY_MS = 2500;
        var NEXT_RETRY_FAST_MS = 400;
        var NEXT_MAX_TRIES = 4;
        var FAST_ANIM_DURATION = 0.01;

        // ---------- 小工具 ----------

        function readNumber(key, fallback, min, max) {
            try {
                var raw = window.localStorage.getItem(key);
                if (raw === null || raw === '') return fallback;
                var value = Number(raw);
                if (!isFinite(value)) return fallback;
                return Math.min(max, Math.max(min, value));
            } catch (e) {
                return fallback;
            }
        }

        function saveNumber(key, value) {
            try {
                window.localStorage.setItem(key, String(value));
            } catch (e) {
                /* 存储被禁用时忽略 */
            }
        }

        function readFlag(key, fallback) {
            try {
                var raw = window.localStorage.getItem(key);
                if (raw === null || raw === '') return fallback;
                return raw === '1' || raw === 'true';
            } catch (e) {
                return fallback;
            }
        }

        function saveFlag(key, value) {
            try {
                window.localStorage.setItem(key, value ? '1' : '0');
            } catch (e) {
                /* 忽略 */
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function now() {
            return Date.now();
        }

        // ---------- 状态 ----------

        var state = {
            running: false,
            timer: null,
            lastKey: '',
            pendingKey: '',
            pendingAt: 0,
            answered: 0,
            correct: 0,
            wrong: 0,
            skipped: 0,
            accuracy: readNumber('a366_boat_accuracy', 100, 0, 100),
            answerDelay: readNumber('a366_boat_answer_delay', 100, 0, 60000),
            nextDelay: readNumber('a366_boat_next_delay', 100, 0, 60000),
            skipAnim: readFlag('a366_boat_skip_anim', false),
            answeredAt: 0,
            nextKey: '',
            nextAt: 0,
            nextTries: 0,
            warnedTime: false,
            warnedKey: ''
        };

        var ui = {
            panel: null,
            launcher: null,
            log: null,
            toggle: null,
            accuracy: null,
            accuracyVal: null,
            answerDelay: null,
            nextDelay: null,
            skip: null,
            stats: {}
        };

        // ---------- 日志 ----------

        function addLog(message, type) {
            if (!ui.log) return;

            var time = '';
            try {
                time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            } catch (e) {
                time = new Date().toLocaleTimeString();
            }

            var stick = ui.log.scrollHeight - ui.log.scrollTop - ui.log.clientHeight < 24;
            var row = document.createElement('div');
            row.className = 'a366-log-' + (type || 'info');
            row.innerHTML = '<span class="a366-ts">[' + time + ']</span>' + escapeHtml(message);
            ui.log.appendChild(row);

            while (ui.log.childNodes.length > LOG_LIMIT) {
                ui.log.removeChild(ui.log.firstChild);
            }
            if (stick) ui.log.scrollTop = ui.log.scrollHeight;
        }

        function log(message, type) {
            if (window.console && console.log) {
                console.log('%c[AutoBoat] ' + message, 'color:#f5a623;font-weight:bold');
            }
            addLog(message, type || 'info');
        }

        function warn(message) {
            if (window.console && console.warn) {
                console.warn('[AutoBoat] ' + message);
            }
            addLog(message, 'warn');
        }

        // ---------- 场景读取 ----------

        function getCc() {
            var cc = window.cc;
            if (!cc || !cc.director || !cc.Component) return null;
            return cc;
        }

        // 在场景里找 AnswerArea：一定带 _answerIndex、options 数组和 onSelect
        var cachedArea = null;

        function findAnswerArea() {
            if (cachedArea && cachedArea.isValid !== false &&
                cachedArea.node && cachedArea.node.isValid) {
                return cachedArea;
            }
            cachedArea = null;

            var cc = getCc();
            if (!cc) return null;

            var scene = cc.director.getScene();
            if (!scene) return null;

            var comps;
            try {
                comps = scene.getComponentsInChildren(cc.Component);
            } catch (e) {
                return null;
            }
            for (var i = 0; i < comps.length; i++) {
                var c = comps[i];
                if (!c) continue;
                if (c._answerIndex !== undefined &&
                    Array.isArray(c.options) &&
                    typeof c.onSelect === 'function') {
                    cachedArea = c;
                    return c;
                }
            }
            return null;
        }

        // 选项节点的 click 事件：这个构建里 cc.EventType 没挂到全局，
        // 但 Button.EventType.CLICK 就是同一个字符串。
        function clickEventType(cc) {
            if (cc && cc.Button && cc.Button.EventType && cc.Button.EventType.CLICK) {
                return cc.Button.EventType.CLICK;
            }
            if (cc && cc.EventType && cc.EventType.CLICK) {
                return cc.EventType.CLICK;
            }
            return 'click';
        }

        // 触发选项点击：复用组件 start() 里注册的 CLICK 回调，失效时退回 onSelect
        function clickOption(aa, index) {
            var cc = getCc();
            var option = aa.options && aa.options[index];
            if (option && option.node && option.node.isValid) {
                try {
                    option.node.emit(clickEventType(cc), option.node);
                } catch (e) {
                    warn('派发选项点击事件失败: ' + e);
                }
                if (aa._answered) return true;
            }
            if (typeof aa.onSelect === 'function') {
                try {
                    aa.onSelect(index);
                } catch (e) {
                    warn('调用 onSelect 失败: ' + e);
                }
            }
            return !!aa._answered;
        }

        function optionLabel(aa, index) {
            var option = aa.options && aa.options[index];
            if (!option) return '';
            var title = option.titleLabel && option.titleLabel.string
                ? String(option.titleLabel.string).trim() : '';
            var sub = option.subLabel && option.subLabel.string
                ? String(option.subLabel.string).trim() : '';
            if (title && sub) return title + ' / ' + sub;
            return title || sub;
        }

        function questionText(aa) {
            var node = aa.questionLabel;
            var text = node && node.string ? String(node.string).trim() : '';
            return text || '当前题目';
        }

        function questionKey(aa) {
            return [aa._wordId, aa._answerIndex, aa._questionStartMs].join('|');
        }

        // 故意答错时换一个合法选项（龙舟只有两个选项）
        function pickWrongIndex(aa, answerIndex) {
            var options = aa.options || [];
            var pool = [];
            for (var i = 0; i < options.length; i++) {
                if (i === answerIndex) continue;
                if (options[i] && options[i].node && options[i].node.isValid) pool.push(i);
            }
            if (!pool.length) return -1;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // ---------- 主循环 ----------

        function tick() {
            if (!state.running) return;

            var aa = findAnswerArea();
            if (!aa) return;

            if (state.skipAnim) applySkipDurations(aa);

            var key = questionKey(aa);

            // ---- 还没作答：先等“作答间隔”，再按正确率决定点哪个 ----
            if (!aa._answered) {
                var answerIndex = aa._answerIndex;
                if (typeof answerIndex !== 'number' || answerIndex < 0) return; // 题目还没下发
                if (key === state.lastKey) return;                               // 同一题只点一次

                if (state.pendingKey !== key) {
                    state.pendingKey = key;
                    state.pendingAt = now();
                }
                if (now() - state.pendingAt < state.answerDelay) return;

                if (typeof aa.canAnswer === 'function') {
                    var canAnswer = true;
                    try { canAnswer = aa.canAnswer(); } catch (e) { canAnswer = true; }
                    if (!canAnswer) {
                        if (!state.warnedTime) {
                            state.warnedTime = true;
                            warn('当前不能作答（今日时长已结束或赛季结算中）');
                        }
                        return;
                    }
                }
                state.warnedTime = false;

                state.pendingKey = '';
                state.lastKey = key;

                var correct = Math.random() * 100 < state.accuracy;
                var chosen = correct ? answerIndex : pickWrongIndex(aa, answerIndex);
                if (chosen < 0) {
                    chosen = answerIndex;
                    correct = true;
                }

                if (!clickOption(aa, chosen)) {
                    state.skipped++;
                    state.lastKey = '';
                    // 同一题点击失败只提示一次，避免每 100ms 刷屏
                    if (state.warnedKey !== key) {
                        state.warnedKey = key;
                        addLog('点击第 ' + (chosen + 1) + ' 个选项未生效', 'warn');
                    }
                    updateStats();
                    return;
                }

                state.answered++;
                if (correct) state.correct++;
                else state.wrong++;
                state.warnedKey = '';
                state.answeredAt = now();

                addLog((correct ? '作答 ✓ ' : '作答 ✗ ') + questionText(aa) +
                    ' → ' + optionLabel(aa, chosen), correct ? 'success' : 'warn');
                updateStats();
                return;
            }

            // ---- 已作答：等“切题间隔”，再点下一题 ----
            if (now() - state.answeredAt < state.nextDelay) return;

            if (state.nextKey !== key) {
                state.nextKey = key;
                state.nextAt = 0;
                state.nextTries = 0;
            }
            if (state.nextTries >= NEXT_MAX_TRIES) return;
            if (now() - state.nextAt < nextRetryMs()) return;

            state.nextAt = now();
            state.nextTries++;

            if (typeof aa.onNext !== 'function') return;
            try {
                aa.onNext();
                addLog('下一题 →', 'info');
            } catch (e) {
                addLog('切换下一题失败: ' + e, 'error');
            }
        }

        function startAuto() {
            if (state.running) return;
            state.running = true;
            state.lastKey = '';
            state.pendingKey = '';
            state.pendingAt = 0;
            state.nextKey = '';
            state.nextTries = 0;
            state.warnedKey = '';
            restartTimer();
            log('自动答题已启动（正确率 ' + state.accuracy + '%，作答间隔 ' +
                state.answerDelay + 'ms，切题间隔 ' + state.nextDelay + 'ms' +
                (state.skipAnim ? '，已跳过动画' : '') + '）');
            syncUI();
        }

        function stopAuto() {
            if (!state.running) return;
            state.running = false;
            restartTimer();
            log('自动答题已停止，累计作答 ' + state.answered + ' 题');
            syncUI();
        }

        function updateStats() {
            if (!ui.stats.answered) return;
            ui.stats.answered.textContent = String(state.answered);
            ui.stats.correct.textContent = String(state.correct);
            ui.stats.wrong.textContent = String(state.wrong);
            ui.stats.rate.textContent = state.answered
                ? Math.round(state.correct / state.answered * 100) + '%'
                : '-';
        }

        function syncUI() {
            if (!ui.panel) return;
            if (state.running) ui.panel.classList.add('a366-running');
            else ui.panel.classList.remove('a366-running');
            if (ui.toggle) {
                ui.toggle.textContent = state.running ? '停止' : '开始';
                if (state.running) ui.toggle.classList.add('a366-stop');
                else ui.toggle.classList.remove('a366-stop');
            }
        }

        function applyAccuracy(value) {
            var v = Number(value);
            if (!isFinite(v)) return;
            v = Math.max(0, Math.min(100, Math.round(v)));
            state.accuracy = v;
            saveNumber('a366_boat_accuracy', v);
            if (ui.accuracy) ui.accuracy.value = String(v);
            if (ui.accuracyVal) ui.accuracyVal.textContent = v + '%';
        }

        function applyAnswerDelay(value) {
            var v = Number(value);
            if (!isFinite(v)) return;
            v = Math.max(0, Math.min(60000, Math.round(v)));
            state.answerDelay = v;
            saveNumber('a366_boat_answer_delay', v);
            if (ui.answerDelay) ui.answerDelay.value = String(v);
        }

        function applyNextDelay(value) {
            var v = Number(value);
            if (!isFinite(v)) return;
            v = Math.max(0, Math.min(60000, Math.round(v)));
            state.nextDelay = v;
            saveNumber('a366_boat_next_delay', v);
            if (ui.nextDelay) ui.nextDelay.value = String(v);
        }

        // ---------- 跳过动画 ----------

        // AnswerArea / OptionButton 的动画时长都是普通字段，直接压短：
        //   bgTweenDuration -> 0（setBgColor 判断 >0，等于直接上色，不启动 tween）
        //   nextClickAnimDuration / clickAnimDuration -> 0.01 秒
        // 这些只影响视觉动画，不参与答题状态推进，因此可以安全地改。
        // 原值备份挂在对象自身上，关掉开关时按对象精确还原。
        function applySkipDurations(aa) {
            if (!aa) return;
            var options = aa.options || [];
            var i;

            if (state.skipAnim) {
                if (aa.bgTweenDuration !== undefined && aa.__a366_bg === undefined) {
                    aa.__a366_bg = aa.bgTweenDuration;
                    aa.bgTweenDuration = 0;
                }
                if (aa.nextClickAnimDuration !== undefined && aa.__a366_next === undefined) {
                    aa.__a366_next = aa.nextClickAnimDuration;
                    aa.nextClickAnimDuration = FAST_ANIM_DURATION;
                }
                for (i = 0; i < options.length; i++) {
                    var option = options[i];
                    if (!option || option.clickAnimDuration === undefined) continue;
                    if (option.__a366_click === undefined) {
                        option.__a366_click = option.clickAnimDuration;
                        option.clickAnimDuration = FAST_ANIM_DURATION;
                    }
                }
                return;
            }

            if (aa.__a366_bg !== undefined && aa.bgTweenDuration !== undefined) {
                aa.bgTweenDuration = aa.__a366_bg;
                delete aa.__a366_bg;
            }
            if (aa.__a366_next !== undefined && aa.nextClickAnimDuration !== undefined) {
                aa.nextClickAnimDuration = aa.__a366_next;
                delete aa.__a366_next;
            }
            for (i = 0; i < options.length; i++) {
                var opt = options[i];
                if (opt && opt.__a366_click !== undefined) {
                    opt.clickAnimDuration = opt.__a366_click;
                    delete opt.__a366_click;
                }
            }
        }

        function restartTimer() {
            if (state.timer) {
                clearInterval(state.timer);
                state.timer = null;
            }
            if (state.running) {
                state.timer = setInterval(tick, state.skipAnim ? TICK_FAST_MS : TICK_MS);
            }
        }

        function applySkip(value) {
            var on = !!value;
            state.skipAnim = on;
            saveFlag('a366_boat_skip_anim', on);
            applySkipDurations(findAnswerArea());
            if (ui.skip) ui.skip.checked = on;
            restartTimer();
        }

        function nextRetryMs() {
            return state.skipAnim ? NEXT_RETRY_FAST_MS : NEXT_RETRY_MS;
        }

        // ---------- 控制台 UI ----------

        var PANEL_CSS = [
            '#a366-boat-panel{position:fixed;right:16px;bottom:16px;z-index:2147483000;width:310px;max-width:calc(100vw - 24px);',
            'background:#fff;color:#212529;border:1px solid #dee2e6;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);',
            'font:12px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;',
            'overflow:hidden;user-select:none;-webkit-user-select:none;}',
            '#a366-boat-panel.a366-dragging{box-shadow:0 16px 44px rgba(0,0,0,.34);}',
            '#a366-boat-panel *{box-sizing:border-box;}',
            '#a366-boat-panel .a366-hd{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f9fa;',
            'border-bottom:1px solid #dee2e6;cursor:move;touch-action:none;-ms-touch-action:none;}',
            '#a366-boat-panel .a366-dot{flex:none;width:8px;height:8px;border-radius:50%;background:#adb5bd;}',
            '#a366-boat-panel.a366-running .a366-dot{background:#28a745;box-shadow:0 0 0 3px rgba(40,167,69,.16);}',
            '#a366-boat-panel .a366-title{flex:1;min-width:0;font-weight:600;color:#007bff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
            '#a366-boat-panel .a366-ib{flex:none;width:22px;height:22px;padding:0;line-height:18px;border:1px solid #dee2e6;',
            'border-radius:4px;background:#fff;color:#6c757d;font-size:12px;cursor:pointer;}',
            '#a366-boat-panel .a366-ib:hover{color:#212529;}',
            '#a366-boat-panel .a366-bd{display:flex;flex-direction:column;gap:8px;padding:10px;}',
            '#a366-boat-panel.a366-collapsed .a366-bd{display:none;}',
            '#a366-boat-panel .a366-stats{display:flex;align-items:center;justify-content:space-between;gap:6px;',
            'padding:6px 8px;background:#f8f9fa;border:1px solid #e9ecef;border-radius:6px;overflow:hidden;}',
            '#a366-boat-panel .a366-stats span{color:#6c757d;white-space:nowrap;}',
            '#a366-boat-panel .a366-stats b{color:#212529;font-weight:600;}',
            '#a366-boat-panel .a366-stats b.ok{color:#28a745;}',
            '#a366-boat-panel .a366-stats b.bad{color:#dc3545;}',
            '#a366-boat-panel .a366-row{display:flex;align-items:center;gap:6px;}',
            '#a366-boat-panel .a366-label{flex:none;color:#6c757d;}',
            '#a366-boat-panel .a366-range{flex:1;min-width:40px;margin:0;accent-color:#007bff;}',
            '#a366-boat-panel .a366-val{flex:none;width:44px;text-align:right;color:#007bff;font-weight:600;}',
            '#a366-boat-panel .a366-num{width:64px;padding:3px 4px;border:1px solid #dee2e6;border-radius:4px;',
            'font-size:12px;text-align:center;color:#212529;background:#fff;outline:none;}',
            '#a366-boat-panel .a366-unit{flex:none;color:#adb5bd;}',
            '#a366-boat-panel .a366-check{display:flex;align-items:center;gap:4px;flex:1;color:#495057;cursor:pointer;}',
            '#a366-boat-panel .a366-check input{margin:0;accent-color:#007bff;cursor:pointer;}',
            '#a366-boat-panel .a366-btn{flex:none;padding:4px 8px;border:1px solid #dee2e6;border-radius:4px;',
            'background:#fff;color:#495057;font-size:12px;cursor:pointer;}',
            '#a366-boat-panel .a366-btn:hover{border-color:#adb5bd;}',
            '#a366-boat-panel .a366-btn.a366-primary{flex:1;background:#007bff;border-color:#007bff;color:#fff;}',
            '#a366-boat-panel .a366-btn.a366-primary.a366-stop{background:#dc3545;border-color:#dc3545;}',

            'background:#fff;font:11px/1.5 Consolas,"Courier New",monospace;word-break:break-all;',
            'user-select:text;-webkit-user-select:text;}',
            '#a366-boat-panel .a366-log>div{padding:1px 0;border-bottom:1px dashed #f1f3f5;}',
            '#a366-boat-panel .a366-log .a366-ts{color:#adb5bd;margin-right:4px;}',
            '#a366-boat-panel .a366-log .a366-log-info{color:#6c757d;}',
            '#a366-boat-panel .a366-log .a366-log-success{color:#28a745;}',
            '#a366-boat-panel .a366-log .a366-log-warn{color:#e67e22;}',
            '#a366-boat-panel .a366-log .a366-log-error{color:#dc3545;}',
            '#a366-boat-launcher{position:fixed;right:16px;bottom:16px;z-index:2147483000;width:44px;height:44px;',
            'border-radius:50%;background:#007bff;color:#fff;display:flex;align-items:center;justify-content:center;',
            'font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;',
            'cursor:pointer;user-select:none;box-shadow:0 4px 16px rgba(0,123,255,.45);}'
        ].join('\n');

        var PANEL_HTML = [
            '<div class="a366-hd" id="a366-boat-hd">',
            '<span class="a366-dot"></span>',
            '<span class="a366-title">百舸争流自动答题</span>',
            '<button type="button" class="a366-ib" data-a366="collapse" title="折叠/展开">—</button>',
            '<button type="button" class="a366-ib" data-a366="hide" title="隐藏控制台">✕</button>',
            '</div>',
            '<div class="a366-bd">',
            '<div class="a366-stats">',
            '<span>已答 <b data-stat="answered">0</b></span>',
            '<span>正确 <b class="ok" data-stat="correct">0</b></span>',
            '<span>错误 <b class="bad" data-stat="wrong">0</b></span>',
            '<span>正确率 <b data-stat="rate">-</b></span>',
            '</div>',
            '<div class="a366-row">',
            '<span class="a366-label">正确率</span>',
            '<input class="a366-range" type="range" min="0" max="100" step="5" data-ctl="accuracy">',
            '<span class="a366-val" data-val="accuracy">100%</span>',

            '</div>',

            '<span class="a366-label">切题间隔</span>',
            '<input class="a366-num" type="number" min="0" max="60000" step="50" data-ctl="next-delay">',

        // 鼠标 + 触控都能拖动；优先 Pointer Events，不支持时退回 mouse/touch。
        function makeDraggable(panel, handle) {
            if (!panel || !handle) return;

            var drag = null;

            function pointOf(e) {
                if (e.touches && e.touches.length) return e.touches[0];
                if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0];
                return e;
            }

            function onDown(e) {
                if (e.button !== undefined && e.button !== 0) return;
                var target = e.target || {};
                var tag = String(target.tagName || '').toLowerCase();
                if (tag === 'button' || tag === 'input' || tag === 'select' || tag === 'textarea' || tag === 'a') return;

                var p = pointOf(e);
                var rect = panel.getBoundingClientRect();
                drag = { x: p.clientX, y: p.clientY, left: rect.left, top: rect.top };

                panel.style.left = rect.left + 'px';
                panel.style.top = rect.top + 'px';
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
                panel.classList.add('a366-dragging');

                if (e.pointerId !== undefined && handle.setPointerCapture) {
                    try { handle.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
                }
                e.preventDefault();
                e.stopPropagation();
            }

            function onMove(e) {
                if (!drag) return;
                var p = pointOf(e);
                var width = panel.offsetWidth || 310;
                var left = drag.left + p.clientX - drag.x;
                var top = drag.top + p.clientY - drag.y;

                left = Math.max(4, Math.min(window.innerWidth - width - 4, left));
                top = Math.max(4, Math.min(window.innerHeight - 44, top));

                panel.style.left = left + 'px';
                panel.style.top = top + 'px';
                e.preventDefault();
            }

            function onUp() {
                if (!drag) return;
                drag = null;
                panel.classList.remove('a366-dragging');
            }

            function bind(el, type, fn, opts) {
                try { el.addEventListener(type, fn, opts); }
                catch (e) { el.addEventListener(type, fn, false); }
            }

            if (window.PointerEvent) {
                bind(handle, 'pointerdown', onDown, false);
                bind(document, 'pointermove', onMove, { passive: false });
                bind(document, 'pointerup', onUp, false);
                bind(document, 'pointercancel', onUp, false);
            } else {
                bind(handle, 'mousedown', onDown, false);
                bind(document, 'mousemove', onMove, false);
                bind(document, 'mouseup', onUp, false);
                bind(handle, 'touchstart', onDown, { passive: false });
                bind(document, 'touchmove', onMove, { passive: false });
                bind(document, 'touchend', onUp, false);
                bind(document, 'touchcancel', onUp, false);
            }
        }

        function showLauncher() {
            if (!ui.launcher) {
                var launcher = document.createElement('div');
                launcher.id = 'a366-boat-launcher';
                launcher.textContent = '舟';
                launcher.title = '打开自动答题控制台';
                launcher.addEventListener('click', function () {
                    launcher.style.display = 'none';
                    if (ui.panel) ui.panel.style.display = '';
                });
                document.body.appendChild(launcher);
                ui.launcher = launcher;
            }
            ui.launcher.style.display = 'flex';
        }

        function createUI() {
            if (document.getElementById('a366-boat-panel')) return;

            var style = document.createElement('style');
            style.id = 'a366-boat-style';
            style.textContent = PANEL_CSS;
            (document.head || document.documentElement).appendChild(style);

            var panel = document.createElement('div');
            panel.id = 'a366-boat-panel';
            panel.innerHTML = PANEL_HTML;
            document.body.appendChild(panel);
            ui.panel = panel;

            ui.log = panel.querySelector('[data-log]');
            ui.toggle = panel.querySelector('[data-a366="toggle"]');
            ui.accuracy = panel.querySelector('[data-ctl="accuracy"]');
            ui.accuracyVal = panel.querySelector('[data-val="accuracy"]');
            ui.answerDelay = panel.querySelector('[data-ctl="answer-delay"]');
            ui.nextDelay = panel.querySelector('[data-ctl="next-delay"]');
            ui.skip = panel.querySelector('[data-ctl="skip"]');
            ui.stats.answered = panel.querySelector('[data-stat="answered"]');
            ui.stats.correct = panel.querySelector('[data-stat="correct"]');
            ui.stats.wrong = panel.querySelector('[data-stat="wrong"]');
            ui.stats.rate = panel.querySelector('[data-stat="rate"]');

            applyAccuracy(state.accuracy);
            applyAnswerDelay(state.answerDelay);
            applyNextDelay(state.nextDelay);
            applySkip(state.skipAnim);

            panel.querySelector('[data-a366="collapse"]').addEventListener('click', function () {
                panel.classList.toggle('a366-collapsed');
            });

            panel.querySelector('[data-a366="hide"]').addEventListener('click', function () {
                panel.style.display = 'none';
                showLauncher();
            });

            ui.toggle.addEventListener('click', function () {
                if (state.running) stopAuto();
                else startAuto();
            });

            panel.querySelector('[data-a366="clear"]').addEventListener('click', function () {
                if (ui.log) ui.log.innerHTML = '';
            });

            ui.accuracy.addEventListener('input', function () {
                applyAccuracy(this.value);
            });
            ui.accuracy.addEventListener('change', function () {
                addLog('正确率已设为 ' + state.accuracy + '%', 'info');
            });

            ui.answerDelay.addEventListener('change', function () {
                applyAnswerDelay(this.value);
                addLog('作答间隔已设为 ' + state.answerDelay + 'ms', 'info');
            });

            ui.nextDelay.addEventListener('change', function () {
                applyNextDelay(this.value);
                addLog('切题间隔已设为 ' + state.nextDelay + 'ms', 'info');
            });

            ui.skip.addEventListener('change', function () {
                applySkip(this.checked);
                addLog('跳过动画已' + (state.skipAnim ? '开启' : '关闭'), 'info');
            });

            var presets = panel.querySelectorAll('[data-preset]');
            for (var i = 0; i < presets.length; i++) {
                presets[i].addEventListener('click', function () {
                    var kind = this.getAttribute('data-preset');
                    var value = this.getAttribute('data-value');
                    if (kind === 'answer-delay') {
                        applyAnswerDelay(value);
                        addLog('作答间隔已设为 ' + state.answerDelay + 'ms', 'info');
                    } else {
                        applyNextDelay(value);
                        addLog('切题间隔已设为 ' + state.nextDelay + 'ms', 'info');
                    }
                });
            }

            makeDraggable(panel, panel.querySelector('#a366-boat-hd'));
        }

        // ---------- 启动 ----------

        function boot() {
            createUI();
            updateStats();
            syncUI();
            addLog('控制台已就绪（正确率 ' + state.accuracy + '%，作答间隔 ' +
                state.answerDelay + 'ms，切题间隔 ' + state.nextDelay + 'ms，跳过动画 ' +
                (state.skipAnim ? '开' : '关') + '），点击“开始”启动', 'info');
        }

        var api = {
            version: VERSION,
            start: startAuto,
            stop: stopAuto,
            show: function () {
                if (ui.panel) ui.panel.style.display = '';
                if (ui.launcher) ui.launcher.style.display = 'none';
            },
            hide: function () {
                if (ui.panel) ui.panel.style.display = 'none';
                showLauncher();
            },
            setAccuracy: applyAccuracy,
            setAnswerDelay: applyAnswerDelay,
            setNextDelay: applyNextDelay,
            setSkipAnim: applySkip,
            status: function () {
                return {
                    running: state.running,
                    answered: state.answered,
                    correct: state.correct,
                    wrong: state.wrong,
                    skipped: state.skipped,
                    accuracy: state.accuracy,
                    answerDelay: state.answerDelay,
                    nextDelay: state.nextDelay,
                    skipAnim: state.skipAnim,
                    lastKey: state.lastKey
                };
            }
        };

        window.AutoBoat = api;
        window.AutoRegatta = api; // 兼容旧页面里用过的名字

        if (document.body) boot();
        else document.addEventListener('DOMContentLoaded', boot);
    })();
</script>
